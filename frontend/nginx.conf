server {
    listen 80;
    client_max_body_size 6m;

    # 后端 API 反向代理
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 图片静态资源（由后端存储）
    location /uploads/ {
        proxy_pass http://backend:8080;
    }

    # 前端单页应用
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}