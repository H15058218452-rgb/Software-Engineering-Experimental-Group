server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/shop?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      # 启动时自动执行 schema.sql（全部使用 IF NOT EXISTS，可重复执行）
      mode: always
      schema-locations: classpath:schema.sql
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

app:
  jwt-secret: "online-shop-mvp-secret-0123456789abcdef"
  jwt-expire-hours: 24
  upload-dir: ./uploads
  default-seller:
    username: seller
    password: seller123456

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.example.shop: info
