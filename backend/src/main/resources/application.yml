server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/shop?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      # 启动时依次执行：建表脚本 + 需求 A 迁移脚本（均幂等，可重复执行）
      mode: always
      schema-locations: classpath:schema.sql,classpath:migration-a.sql
  servlet:
    multipart:
      # 商品图库单张限制 5MB 由业务代码校验；富文本正文内嵌视频不做格式/大小限制，
      # 因此这里把传输层上限放宽到 100MB，避免大视频直接 413
      max-file-size: 100MB
      max-request-size: 120MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

app:
  jwt-secret: "online-shop-mvp-secret-0123456789abcdef"
  jwt-expire-hours: 24
  # 图片上传目录。默认用系统临时目录：实测本机安全软件（火绒）会拦截后端进程在桌面/用户目录/Public/D盘建目录导致上传失败，只有临时目录放行。
  # 如需持久化到其他位置，启动时加参数覆盖：--app.upload-dir=D:/shop-uploads
  upload-dir: ${java.io.tmpdir}/shop-uploads
  default-seller:
    username: seller
    password: seller123456

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.example.shop: info
