<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1540 566" width="1540" height="566" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif">
  <defs>
    <marker id="arrDark" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2b2b2b"/>
    </marker>
    <marker id="arrGray" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#6b6b6b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1540" height="566" fill="#ffffff"/>

  <text x="40" y="40" font-size="21" font-weight="bold" fill="#1a1a1a">订单状态流转图（挑战需求 C · 迭代 4）</text>
  <text x="40" y="64" font-size="13" fill="#555555">7 个业务状态按序推进，不可跳态、不可回退；「待支付」24 小时未付款自动取消，取消按角色区分</text>

  <!-- 起始 -->
  <circle cx="20" cy="152.0" r="7" fill="#2b2b2b"/>
  <line x1="27" y1="152.0" x2="40" y2="152.0" stroke="#2b2b2b" stroke-width="1.6" marker-end="url(#arrDark)"/>

  <rect x="48" y="110" width="150" height="84" rx="8" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.8"/>
  <text x="123.0" y="98" font-size="12" fill="#555555" text-anchor="middle">10</text>
  <text x="123.0" y="142" font-size="17" font-weight="bold" fill="#1a1a1a" text-anchor="middle">客户下单</text>
  <text x="123.0" y="168" font-size="11" fill="#666666" text-anchor="middle">下单成功即扣库存</text>
  <line x1="198" y1="152.0" x2="254" y2="152.0" stroke="#2b2b2b" stroke-width="1.8" marker-end="url(#arrDark)"/>
  <text x="226.0" y="140.0" font-size="11" fill="#555555" text-anchor="middle">下单</text>

  <rect x="258" y="110" width="150" height="84" rx="8" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.8"/>
  <text x="333.0" y="98" font-size="12" fill="#555555" text-anchor="middle">15</text>
  <text x="333.0" y="142" font-size="17" font-weight="bold" fill="#1a1a1a" text-anchor="middle">待支付</text>
  <text x="333.0" y="168" font-size="11" fill="#666666" text-anchor="middle">24 小时未付款自动取消</text>
  <line x1="408" y1="152.0" x2="464" y2="152.0" stroke="#2b2b2b" stroke-width="1.8" marker-end="url(#arrDark)"/>
  <text x="436.0" y="140.0" font-size="11" fill="#555555" text-anchor="middle">支付</text>

  <rect x="468" y="110" width="150" height="84" rx="8" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.8"/>
  <text x="543.0" y="98" font-size="12" fill="#555555" text-anchor="middle">18</text>
  <text x="543.0" y="142" font-size="17" font-weight="bold" fill="#1a1a1a" text-anchor="middle">已支付</text>
  <text x="543.0" y="168" font-size="11" fill="#666666" text-anchor="middle">记录支付渠道</text>
  <line x1="618" y1="152.0" x2="674" y2="152.0" stroke="#2b2b2b" stroke-width="1.8" marker-end="url(#arrDark)"/>
  <text x="646.0" y="140.0" font-size="11" fill="#555555" text-anchor="middle">确认</text>

  <rect x="678" y="110" width="150" height="84" rx="8" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.8"/>
  <text x="753.0" y="98" font-size="12" fill="#555555" text-anchor="middle">20</text>
  <text x="753.0" y="142" font-size="17" font-weight="bold" fill="#1a1a1a" text-anchor="middle">商家确认</text>
  <text x="753.0" y="168" font-size="11" fill="#666666" text-anchor="middle">商家单方推进</text>
  <line x1="828" y1="152.0" x2="884" y2="152.0" stroke="#2b2b2b" stroke-width="1.8" marker-end="url(#arrDark)"/>
  <text x="856.0" y="140.0" font-size="11" fill="#555555" text-anchor="middle">备货</text>

  <rect x="888" y="110" width="150" height="84" rx="8" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.8"/>
  <text x="963.0" y="98" font-size="12" fill="#555555" text-anchor="middle">30</text>
  <text x="963.0" y="142" font-size="17" font-weight="bold" fill="#1a1a1a" text-anchor="middle">备货完成</text>
  <text x="963.0" y="168" font-size="11" fill="#666666" text-anchor="middle">商家单方推进</text>
  <line x1="1038" y1="152.0" x2="1094" y2="152.0" stroke="#2b2b2b" stroke-width="1.8" marker-end="url(#arrDark)"/>
  <text x="1066.0" y="140.0" font-size="11" fill="#555555" text-anchor="middle">发货</text>

  <rect x="1098" y="110" width="150" height="84" rx="8" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.8"/>
  <text x="1173.0" y="98" font-size="12" fill="#555555" text-anchor="middle">40</text>
  <text x="1173.0" y="142" font-size="17" font-weight="bold" fill="#1a1a1a" text-anchor="middle">开始发货</text>
  <text x="1173.0" y="168" font-size="11" fill="#666666" text-anchor="middle">填物流单号</text>
  <line x1="1248" y1="152.0" x2="1304" y2="152.0" stroke="#2b2b2b" stroke-width="1.8" marker-end="url(#arrDark)"/>
  <text x="1276.0" y="140.0" font-size="11" fill="#555555" text-anchor="middle">收货</text>

  <rect x="1308" y="110" width="150" height="84" rx="8" fill="#f4f4f4" stroke="#2b2b2b" stroke-width="2.6"/>
  <text x="1383.0" y="98" font-size="12" fill="#555555" text-anchor="middle">50</text>
  <text x="1383.0" y="142" font-size="17" font-weight="bold" fill="#1a1a1a" text-anchor="middle">交易完成</text>
  <text x="1383.0" y="168" font-size="11" fill="#666666" text-anchor="middle">客户确认收货 · 终态</text>
  <!-- 取消旁路：15 / 18 / 20 / 30 客户或商家，40 仅商家 -->
  <line x1="123.0" y1="194" x2="123.0" y2="312" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrGray)"/>
  <text x="131.0" y="262" font-size="11" fill="#555555">客户 / 商家</text>
  <line x1="333.0" y1="194" x2="333.0" y2="312" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrGray)"/>
  <text x="341.0" y="262" font-size="11" fill="#555555">客户 / 商家</text>
  <line x1="543.0" y1="194" x2="543.0" y2="312" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrGray)"/>
  <text x="551.0" y="262" font-size="11" fill="#555555">客户 / 商家</text>
  <line x1="753.0" y1="194" x2="753.0" y2="312" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrGray)"/>
  <text x="761.0" y="262" font-size="11" fill="#555555">客户 / 商家</text>
  <line x1="963.0" y1="194" x2="963.0" y2="312" stroke="#6b6b6b" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrGray)"/>
  <text x="971.0" y="262" font-size="11" fill="#555555">仅商家</text>

  <!-- 已取消终态条 -->
  <rect x="48" y="320" width="1410" height="80" rx="8" fill="#f4f4f4" stroke="#2b2b2b" stroke-width="2.6"/>
  <text x="80" y="354" font-size="17" font-weight="bold" fill="#1a1a1a">90 · 已取消</text>
  <text x="80" y="378" font-size="12" fill="#666666">终态 · 按订单明细回补库存；因归零被自动下架的商品，回补后恢复在售；已支付订单取消须原路退款</text>
  <text x="1428" y="378" font-size="12" fill="#666666" text-anchor="end">客户可取消 15 / 18 / 20 / 30　商家可取消 15 / 18 / 20 / 30 / 40</text>

  <!-- 图例 -->
  <line x1="48" y1="436" x2="88" y2="436" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrGray)"/>
  <text x="96" y="440" font-size="12" fill="#555555">客户、商家均可取消</text>
  <line x1="248" y1="436" x2="288" y2="436" stroke="#6b6b6b" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrGray)"/>
  <text x="296" y="440" font-size="12" fill="#555555">仅商家可取消</text>

  <text x="48" y="474" font-size="12" fill="#555555">非法操作一律拦截并报错（40921 / 40923）：跳态、回退、重复提交同一状态、客户在 40 及之后取消、对终态再操作。</text>
  <text x="48" y="498" font-size="12" fill="#555555">合法流转共 11 条：正向 6 条（10→15→18→20→30→40→50），取消 5 条（15 / 18 / 20 / 30 → 90 为客户或商家，40 → 90 仅商家）。</text>
  <text x="48" y="522" font-size="12" fill="#555555">「交易完成」只有客户点「确认收货」能触发，没有超时自动确认，商家不能代替。</text>
</svg>
