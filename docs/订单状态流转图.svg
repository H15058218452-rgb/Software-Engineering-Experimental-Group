<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 540" width="1180" height="540" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif">
  <defs>
    <marker id="arrDark" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2b2b2b"/>
    </marker>
    <marker id="arrGray" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#6b6b6b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="540" fill="#ffffff"/>

  <text x="40" y="40" font-size="21" font-weight="bold" fill="#1a1a1a">订单状态流转图（挑战需求 B · B.1）</text>
  <text x="40" y="64" font-size="13" fill="#555555">5 个业务状态按序推进，不可跳态、不可回退；交易完成与已取消为终态</text>

  <!-- 起始 -->
  <circle cx="20" cy="152" r="7" fill="#2b2b2b"/>
  <line x1="27" y1="152" x2="40" y2="152" stroke="#2b2b2b" stroke-width="1.6" marker-end="url(#arrDark)"/>

  <!-- 主链 5 个状态 -->
  <rect x="48" y="110" width="180" height="84" rx="8" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.8"/>
  <text x="138" y="98" font-size="12" fill="#555555" text-anchor="middle">10</text>
  <text x="138" y="142" font-size="17" font-weight="bold" fill="#1a1a1a" text-anchor="middle">客户下单</text>
  <text x="138" y="168" font-size="12" fill="#666666" text-anchor="middle">下单成功即扣减库存</text>

  <line x1="230" y1="152" x2="274" y2="152" stroke="#2b2b2b" stroke-width="1.8" marker-end="url(#arrDark)"/>
  <text x="252" y="144" font-size="11" fill="#555555" text-anchor="middle">确认</text>

  <rect x="278" y="110" width="180" height="84" rx="8" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.8"/>
  <text x="368" y="98" font-size="12" fill="#555555" text-anchor="middle">20</text>
  <text x="368" y="142" font-size="17" font-weight="bold" fill="#1a1a1a" text-anchor="middle">商家确认</text>
  <text x="368" y="168" font-size="12" fill="#666666" text-anchor="middle">商家单方推进</text>

  <line x1="460" y1="152" x2="504" y2="152" stroke="#2b2b2b" stroke-width="1.8" marker-end="url(#arrDark)"/>
  <text x="482" y="144" font-size="11" fill="#555555" text-anchor="middle">备货</text>

  <rect x="508" y="110" width="180" height="84" rx="8" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.8"/>
  <text x="598" y="98" font-size="12" fill="#555555" text-anchor="middle">30</text>
  <text x="598" y="142" font-size="17" font-weight="bold" fill="#1a1a1a" text-anchor="middle">备货完成</text>
  <text x="598" y="168" font-size="12" fill="#666666" text-anchor="middle">商家单方推进</text>

  <line x1="690" y1="152" x2="734" y2="152" stroke="#2b2b2b" stroke-width="1.8" marker-end="url(#arrDark)"/>
  <text x="712" y="144" font-size="11" fill="#555555" text-anchor="middle">发货</text>

  <rect x="738" y="110" width="180" height="84" rx="8" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.8"/>
  <text x="828" y="98" font-size="12" fill="#555555" text-anchor="middle">40</text>
  <text x="828" y="142" font-size="17" font-weight="bold" fill="#1a1a1a" text-anchor="middle">开始发货</text>
  <text x="828" y="168" font-size="12" fill="#666666" text-anchor="middle">商家单方推进</text>

  <line x1="920" y1="152" x2="964" y2="152" stroke="#2b2b2b" stroke-width="1.8" marker-end="url(#arrDark)"/>
  <text x="942" y="144" font-size="11" fill="#555555" text-anchor="middle">完成</text>

  <rect x="968" y="110" width="180" height="84" rx="8" fill="#f4f4f4" stroke="#2b2b2b" stroke-width="2.6"/>
  <text x="1058" y="98" font-size="12" fill="#555555" text-anchor="middle">50</text>
  <text x="1058" y="142" font-size="17" font-weight="bold" fill="#1a1a1a" text-anchor="middle">交易完成</text>
  <text x="1058" y="168" font-size="12" fill="#666666" text-anchor="middle">终态 · 不再动库存</text>

  <!-- 取消旁路：从 10 / 20 / 30 / 40 各自向下 -->
  <line x1="138" y1="194" x2="138" y2="312" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrGray)"/>
  <text x="146" y="262" font-size="11" fill="#555555">客户 / 商家</text>

  <line x1="368" y1="194" x2="368" y2="312" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrGray)"/>
  <text x="376" y="262" font-size="11" fill="#555555">客户 / 商家</text>

  <line x1="598" y1="194" x2="598" y2="312" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrGray)"/>
  <text x="606" y="262" font-size="11" fill="#555555">客户 / 商家</text>

  <line x1="828" y1="194" x2="828" y2="312" stroke="#6b6b6b" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrGray)"/>
  <text x="836" y="262" font-size="11" fill="#555555">仅商家</text>

  <!-- 已取消终态条 -->
  <rect x="48" y="320" width="1100" height="80" rx="8" fill="#f4f4f4" stroke="#2b2b2b" stroke-width="2.6"/>
  <text x="80" y="354" font-size="17" font-weight="bold" fill="#1a1a1a">90 · 已取消</text>
  <text x="80" y="378" font-size="12" fill="#666666">终态 · 按订单明细逐条回补库存；因库存归零被自动下架的商品，回补后恢复在售</text>
  <text x="1116" y="378" font-size="12" fill="#666666" text-anchor="end">客户只能取消 10 / 20 / 30　商家可取消 10 / 20 / 30 / 40</text>

  <!-- 图例 -->
  <line x1="48" y1="436" x2="88" y2="436" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#arrGray)"/>
  <text x="96" y="440" font-size="12" fill="#555555">客户、商家均可取消</text>
  <line x1="248" y1="436" x2="288" y2="436" stroke="#6b6b6b" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrGray)"/>
  <text x="296" y="440" font-size="12" fill="#555555">仅商家可取消</text>

  <text x="48" y="474" font-size="12" fill="#555555">非法操作一律拦截并报错（40921 / 40923）：跳态、回退、重复提交同一状态、客户在发货后取消、对终态再操作。</text>
  <text x="48" y="498" font-size="12" fill="#555555">合法流转共 8 条：正向 4 条（10→20→30→40→50），取消 4 条（10 / 20 / 30 / 40 → 90）。</text>
</svg>
